<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cuántos cachorritos? · Luna &amp; Max</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">

    <header class="header">
      <p class="eyebrow">Luna &amp; Max</p>
      <h1 class="title">¿Cómo serán sus cachorritos?</h1>
    </header>

    <section class="selector-card">

      <div class="count-display" aria-live="polite">
        <span class="count-number" id="countNumber">6</span>
        <span class="count-label" id="countLabel">cachorritos</span>
      </div>

      <div class="slider-wrap">
        <input
          type="range"
          id="puppySlider"
          class="puppy-slider"
          min="1"
          max="12"
          step="1"
          value="6"
          aria-label="Número de cachorritos"
        >
      </div>

      <div class="puppy-bed" id="puppyBed" role="list" aria-label="Cachorritos"></div>

      <p class="instructions">
        Toca a cada cachorrito para elegir si es niño o niña<br>
        y el tono de su pelaje.
      </p>

    </section>

    <footer class="footer">
      <p>Hecho con 🐾 para la camada de Luna &amp; Max</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
